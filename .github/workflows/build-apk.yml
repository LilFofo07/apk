name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Permite disparar manualmente com 1 clique no GitHub

jobs:
  build:
    name: Compilar APK Android Release
    runs-on: ubuntu-latest

    steps:
      - name: Clonar o Repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Instalar Dependências do App
        working-directory: ./mobile
        run: flutter pub get

      - name: Compilar APK Release (Sem assinatura para teste/instalação direta)
        working-directory: ./mobile
        run: flutter build apk --release

      - name: Salvar APK como Artefato para Download
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
